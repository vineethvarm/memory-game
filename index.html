<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Memory Match Game</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="container">
    <h1>Memory Match Game</h1>
    <div class="controls">
      <button id="restart-btn">Restart</button>
      <select id="level" onchange="startGame()">
        <option value="4">Easy (4x4)</option>
        <option value="5">Medium (5x5)</option>
        <option value="6">Hard (6x6)</option>
      </select>
      <button id="mute-btn">🔊</button>
      <button id="hint-btn" title="Hint">💡 Hint</button>
      <button id="pause-btn" title="Pause">⏸️ Pause</button>
      <select id="theme-selector" title="Select Theme">
        <option value="default">Default Theme</option>
        <option value="dark">Dark Theme</option>
        <option value="light">Light Theme</option>
      </select>
      <label for="volume-slider" title="Volume Control">🔊</label>
      <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.3" />
      <label for="challenge-mode-toggle" title="Challenge Mode">Challenge Mode</label>
      <input type="checkbox" id="challenge-mode-toggle" />
      <input type="number" id="move-limit" placeholder="Move Limit" min="1" style="width: 90px; display:none;" />
      <input type="number" id="time-limit" placeholder="Time Limit (s)" min="1" style="width: 110px; display:none;" />
      <label for="toggle-icons" title="Toggle Card Faces">Icons</label>
      <input type="checkbox" id="toggle-icons" />
    </div>
    <p id="status">Moves: 0 | Time: 0s | Best: --</p>
    <div id="leaderboard" class="leaderboard" style="text-align:left; margin: 10px auto; max-width: 600px; color: #fff;">
      <h3>Leaderboard</h3>
      <ol id="leaderboard-list"></ol>
    </div>
    <div id="game-board" class="game-board"></div>
  </div>

  <div id="start-overlay" class="start-overlay">
    <div class="start-content">
      <h2>Welcome to Memory Match Game!</h2>
      <p>Match all pairs as fast as you can. Select difficulty and press Start to begin.</p>
      <button id="start-btn">Start Game</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
